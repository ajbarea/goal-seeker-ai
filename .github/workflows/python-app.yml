name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.11.5
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      # The Webots controllers themselves need the simulator; the tests cover
      # everything that imports without it.
      - name: pytest
        run: uv run pytest -q
      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
