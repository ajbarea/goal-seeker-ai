[project]
name = "goal-seeker-ai"
version = "0.1.0"
description = "Webots robot that learns to reach a goal with tabular Q-learning or a PyTorch DQN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
